<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f6f3;
      color: #37352f;
      padding: 16px;
      font-size: 14px;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section {
      background: white;
      border: 1px solid #e8e8e4;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #787774;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    select, input[type="date"], input[type="time"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e8e8e4;
      border-radius: 6px;
      font-size: 14px;
      background: #fafafa;
      color: #37352f;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #2eaadc;
      background: white;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sous-taches-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .sous-tache-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid #e8e8e4;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .sous-tache-item:hover { background: #f7f6f3; }
    .sous-tache-item.selected { background: #e8f4fd; border-color: #2eaadc; }

    .sous-tache-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #2eaadc;
    }

    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge.suivi { background: #e3f0ff; color: #2563eb; }
    .badge.st    { background: #f0fdf4; color: #16a34a; }

    .empty-msg {
      color: #9b9b98;
      font-size: 13px;
      text-align: center;
      padding: 12px 0;
    }

    .btn-planifier {
      width: 100%;
      padding: 10px;
      background: #2eaadc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-planifier:hover { background: #2390c0; }
    .btn-planifier:disabled { background: #b8d8e8; cursor: not-allowed; }

    .toast {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .toast.success { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; display: block; }
    .toast.error   { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; display: block; }

    .loader {
      display: none;
      text-align: center;
      color: #9b9b98;
      font-size: 13px;
      padding: 8px 0;
    }
    .loader.active { display: block; }

    textarea { resize: vertical; min-height: 60px; }

    .select-all-btn {
      font-size: 12px;
      color: #2eaadc;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>

<h2>📅 Planifier un créneau</h2>

<!-- Tâche principale -->
<div class="section">
  <label>Tâche principale</label>
  <select id="select-tache">
    <option value="">Chargement...</option>
  </select>
</div>

<!-- Sous-tâches -->
<div class="section" id="section-st" style="display:none">
  <label>Sous-tâches à inclure</label>
  <span class="select-all-btn" id="btn-all">Tout sélectionner</span>
  <div class="loader" id="loader-st">Chargement des sous-tâches...</div>
  <div class="sous-taches-list" id="list-st"></div>
</div>

<!-- Créneau -->
<div class="section">
  <label>Créneau</label>
  <div style="margin-bottom:8px">
    <input type="date" id="input-date" />
  </div>
  <div class="row-2">
    <div>
      <label>Début</label>
      <input type="time" id="input-debut" value="09:00" />
    </div>
    <div>
      <label>Fin</label>
      <input type="time" id="input-fin" value="11:00" />
    </div>
  </div>
</div>

<!-- Notes -->
<div class="section">
  <label>Notes (optionnel)</label>
  <textarea id="input-notes" placeholder="Ce que tu vas faire ce créneau..."></textarea>
</div>

<!-- Bouton -->
<button class="btn-planifier" id="btn-planifier">Planifier →</button>
<div class="toast" id="toast"></div>

<script>
  const BASE_URL = '';  // Vide = même domaine (Render)

  let taches = [];
  let sousTaches = [];
  let selectedST = new Set();

  // ─── Init date du jour ────────────────────────────────────────────────────
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('input-date').value = today;

  // ─── Charge les tâches ────────────────────────────────────────────────────
  async function chargerTaches() {
    const sel = document.getElementById('select-tache');
    try {
      const res = await fetch(`${BASE_URL}/api/taches`);
      taches = await res.json();

      sel.innerHTML = '<option value="">— Choisir une tâche —</option>';
      taches.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.nom + (t.etat ? ` [${t.etat}]` : '');
        sel.appendChild(opt);
      });
    } catch (e) {
      sel.innerHTML = '<option value="">Erreur de chargement</option>';
    }
  }

  // ─── Charge les sous-tâches quand on sélectionne une tâche ───────────────
  document.getElementById('select-tache').addEventListener('change', async (e) => {
    const id = e.target.value;
    const sectionST = document.getElementById('section-st');
    const loaderST  = document.getElementById('loader-st');
    const listST    = document.getElementById('list-st');

    selectedST.clear();

    if (!id) { sectionST.style.display = 'none'; return; }

    sectionST.style.display = 'block';
    loaderST.classList.add('active');
    listST.innerHTML = '';

    try {
      const res = await fetch(`${BASE_URL}/api/taches/${id}/sous-taches`);
      sousTaches = await res.json();
      loaderST.classList.remove('active');

      if (sousTaches.length === 0) {
        listST.innerHTML = '<p class="empty-msg">Aucune sous-tâche trouvée</p>';
        return;
      }

      sousTaches.forEach(st => {
        const item = document.createElement('div');
        item.className = 'sous-tache-item';
        item.dataset.id = st.id;

        const badgeClass = st.source === 'suivi' ? 'suivi' : 'st';
        const badgeLabel = st.source === 'suivi' ? 'suivi' : 'sous-tâche';

        item.innerHTML = `
          <input type="checkbox" id="st-${st.id}" />
          <label for="st-${st.id}" style="font-weight:normal;font-size:13px;text-transform:none;letter-spacing:0;color:#37352f;cursor:pointer;flex:1;margin:0">${st.nom}</label>
          <span class="badge ${badgeClass}">${badgeLabel}</span>
        `;

        item.querySelector('input').addEventListener('change', (ev) => {
          if (ev.target.checked) {
            selectedST.add(st.id);
            item.classList.add('selected');
          } else {
            selectedST.delete(st.id);
            item.classList.remove('selected');
          }
        });

        listST.appendChild(item);
      });

    } catch (e) {
      loaderST.classList.remove('active');
      listST.innerHTML = '<p class="empty-msg">Erreur de chargement</p>';
    }
  });

  // ─── Tout sélectionner ───────────────────────────────────────────────────
  document.getElementById('btn-all').addEventListener('click', () => {
    const checkboxes = document.querySelectorAll('#list-st input[type="checkbox"]');
    const allChecked = [...checkboxes].every(c => c.checked);
    checkboxes.forEach(cb => {
      cb.checked = !allChecked;
      cb.dispatchEvent(new Event('change'));
    });
  });

  // ─── Planifier ───────────────────────────────────────────────────────────
  document.getElementById('btn-planifier').addEventListener('click', async () => {
    const tacheId   = document.getElementById('select-tache').value;
    const date      = document.getElementById('input-date').value;
    const heureDebut = document.getElementById('input-debut').value;
    const heureFin  = document.getElementById('input-fin').value;
    const notes     = document.getElementById('input-notes').value;
    const toast     = document.getElementById('toast');
    const btn       = document.getElementById('btn-planifier');

    toast.className = 'toast';
    toast.textContent = '';

    if (!tacheId || !date || !heureDebut || !heureFin) {
      toast.className = 'toast error';
      toast.textContent = '⚠️ Remplis tous les champs obligatoires.';
      return;
    }

    const stSelectionnees = sousTaches.filter(st => selectedST.has(st.id));

    btn.disabled = true;
    btn.textContent = 'Planification en cours...';

    try {
      const res = await fetch(`${BASE_URL}/api/planifier`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tacheId,
          sousTaches: stSelectionnees,
          date,
          heureDebut,
          heureFin,
          notes
        })
      });

      const data = await res.json();

      if (data.success) {
        const nb = data.creees.length;
        toast.className = 'toast success';
        toast.textContent = `✅ ${nb} entrée${nb > 1 ? 's' : ''} créée${nb > 1 ? 's' : ''} dans Planning !`;

        // Reset
        document.getElementById('select-tache').value = '';
        document.getElementById('section-st').style.display = 'none';
        document.getElementById('input-notes').value = '';
        selectedST.clear();
      } else {
        throw new Error(data.error || 'Erreur inconnue');
      }
    } catch (e) {
      toast.className = 'toast error';
      toast.textContent = `❌ Erreur : ${e.message}`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Planifier →';
    }
  });

  // ─── Démarrage ───────────────────────────────────────────────────────────
  chargerTaches();
</script>
</body>
</html>
